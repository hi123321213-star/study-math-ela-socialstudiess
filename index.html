<style>
:root{
  --bg:#050914;
  --card:#0e162a;
  --neon:#00ffff;
  --text:#ffffff;
}
*{box-sizing:border-box;font-family:Arial;}
body{margin:0;background:radial-gradient(circle at top,#0f1e3d,var(--bg));color:var(--text);}
#logo{width:100px;height:100px;border-radius:50%;display:block;margin:10px auto;cursor:pointer;object-fit:cover;border:2px solid var(--neon);transition:0.3s;}
#logo:hover{box-shadow:0 0 20px var(--neon);transform:scale(1.1);}
.admin{color:gold;font-weight:bold;}

@media(max-width:900px){
  body::before{
    content:"🚫 COMPUTER ONLY";
    position:fixed;inset:0;
    background:black;
    display:grid;
    place-items:center;
    font-size:2rem;
    z-index:9999;
  }
}

#login{height:100vh;display:grid;place-items:center;}
.login-box{
  background:var(--card);
  padding:30px;
  border-radius:15px;
  box-shadow:0 0 25px var(--neon);
  width:300px;
}
.login-box input,button{width:100%;padding:10px;margin-bottom:10px;border:none;border-radius:8px;}
.login-box button{background:var(--neon);font-weight:bold;cursor:pointer;}

#app{display:none;}
header{background:#060b18;padding:12px;display:flex;gap:10px;flex-wrap:wrap;}
header button{
  background:none;border:1px solid var(--neon);color:white;
  padding:8px 14px;cursor:pointer;border-radius:8px;
}
header button:hover{background:var(--neon);color:black;}

#searchBar{width:100%;padding:10px;margin:10px 0;border-radius:8px;border:none;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
}
.card{
  background:var(--card);
  padding:10px;
  border-radius:15px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}
.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px var(--neon);
}
.card img{
  width:100%;
  height:100px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:5px;
}

iframe{width:100%;height:80vh;border:none;}

#chatBox{background:#111;padding:10px;height:200px;overflow-y:auto;border-radius:10px;margin-top:10px;}
#chatInput{width:75%;padding:10px;border-radius:8px;border:none;}
#chatSend{padding:10px;background:var(--neon);border:none;border-radius:8px;cursor:pointer;}
#leaderboard{margin-top:20px;background:#111;padding:10px;border-radius:10px;}
.favorite{color:yellow;font-weight:bold;}
</style>
</head>
<body>

<div id="game"></div>

<div id="chatBox"></div>
<input id="chatInput"><button id="chatSend">Send</button>

<div id="leaderboard">
  <h2>🏆 Leaderboard</h2>
  <div id="leaderboardList"></div>
</div>
</div>

const appDiv=document.getElementById("app");
const loginDiv=document.getElementById("login");

function goHome(){ showCategory('classic'); }

// LOGIN FUNCTION
function login(){
  username=document.getElementById("username").value.trim();
  const pw=document.getElementById("pw").value;
  if(!username || !pw){document.getElementById("err").textContent="Enter username & password"; return;}
  
  // simple password check
  if(pw!==PASSWORD && pw!==ADMIN_PASSWORD && pw!==SECRET_PASSWORD && pw!==REOPEN_PASSWORD){
    document.getElementById("err").textContent="Incorrect password"; return;
  }
  
  loginDiv.style.display="none";
  appDiv.style.display="block";
  isAdmin=pw===ADMIN_PASSWORD;
  if(isAdmin) adminBtn.style.display="inline-block";
  
  showCategory('classic');
  updateLeaderboard();
}

// SEARCH BAR
searchBar.addEventListener('input', ()=>{filterGames(searchBar.value.toLowerCase());});

function filterGames(query){
  document.querySelectorAll('.card').forEach(c=>{
    const name=c.getAttribute('data-name').toLowerCase();
    if(name.includes(query)) c.style.display='block';
    else c.style.display='none';
  });
}

// SHOW CATEGORY
function showCategory(cat){
  saveTime();
  let html='<div class="grid">';
  gameList.forEach(g=>{
    if(g.category===cat){
      html+=`<div class="card" data-name="${g.name}" onclick="loadGame('${g.name}','${g.url}')">
      <img src="icons/${g.icon}" alt="${g.name}"><b>${g.name}</b>
      <button onclick="toggleFavorite(event,'${g.name}')">⭐</button>
      </div>`;
    }
  });
  html+='</div>';
  gameDiv.innerHTML=html;
}

// FAVORITES
function toggleFavorite(e,name){
  e.stopPropagation();
  if(favorites.includes(name)) favorites=favorites.filter(f=>f!==name);
  else favorites.push(name);
  updateFavorites();
}

function updateFavorites(){
  if(favorites.length===0) return;
  let html='<h3>⭐ Favorites</h3><div class="grid">';
  favorites.forEach(f=>{
    const g=gameList.find(x=>x.name===f);
    if(g) html+=`<div class="card" data-name="${g.name}" onclick="loadGame('${g.name}','${g.url}')">
      <img src="icons/${g.icon}" alt="${g.name}"><b>${g.name}</b>
      <button onclick="toggleFavorite(event,'${g.name}')">⭐</button>
    </div>`;
  });
  html+='</div>';
  gameDiv.innerHTML=html+gameDiv.innerHTML;
}

// LOAD GAME + FULLSCREEN + ALT toggle
function loadGame(name,url){
  saveTime();
  currentGame=name;
  startTime=Date.now();
  const iframe=document.createElement('iframe');
  iframe.src=url;
  gameDiv.innerHTML='';
  gameDiv.appendChild(iframe);
  
  // enter fullscreen
  if(document.fullscreenEnabled && !document.fullscreenElement){
    iframe.requestFullscreen().catch(()=>{});
  }
}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.fullscreenElement) document.exitFullscreen();
  if(e.key==='Alt' && !document.fullscreenElement){
    const iframe=gameDiv.querySelector('iframe');
    if(iframe) iframe.requestFullscreen();
  }
});

  }
}

function updateLeaderboard(){
  leaderboardList.innerHTML='<p>Leaderboard will appear here</p>';
}

chatSend.onclick=()=>{chatInput.value='';};
</script>
